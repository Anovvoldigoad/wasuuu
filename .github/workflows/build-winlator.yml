name: Build Winlator Edition x64

on:
  workflow_dispatch:
  push:
    branches: [ main, winlator-port ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.424'

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore NSC-ModManager.Winlator.csproj -r win-x64

      - name: Publish win-x64 self-contained
        run: dotnet publish NSC-ModManager.Winlator.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish/win-x64

      - name: Preflight published files
        shell: cmd
        run: check-publish.bat publish\win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSC-ModManager-Winlator-win-x64
          path: publish/win-x64/**
