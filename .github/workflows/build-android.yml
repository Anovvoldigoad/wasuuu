name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Show .NET info
        run: dotnet --info

      - name: Validate Phase 2C.1 portable source and payload
        run: python3 scripts/validate_phase2c.py

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Resolve Android NDK
        shell: bash
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          else
            NDK=$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
            if [ -z "$NDK" ]; then
              echo "Android NDK not found under $ANDROID_SDK_ROOT/ndk" >&2
              exit 1
            fi
            echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          fi

      - name: Fetch cross-platform CPK toolkit
        run: |
          rm -rf third_party/cpk-toolkit
          git clone --depth 1 https://github.com/darkruss48/cpk-toolkit.git third_party/cpk-toolkit

      - name: Build native CPK bridge (arm64-v8a)
        shell: bash
        run: |
          # Keep CMake output OUTSIDE the project tree. .NET for Android auto-discovers
          # .so files under the project and would otherwise package native/build/*.so too.
          rm -rf native/build native-libs
          CPK_BUILD_DIR="$RUNNER_TEMP/nsc-cpk-build"
          rm -rf "$CPK_BUILD_DIR"
          cmake -S native -B "$CPK_BUILD_DIR" \
            -DCPK_TOOLKIT_DIR="$GITHUB_WORKSPACE/third_party/cpk-toolkit" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$CPK_BUILD_DIR" --config Release -j2
          mkdir -p native-libs/arm64-v8a
          cp "$CPK_BUILD_DIR/libcpkbridge.so" native-libs/arm64-v8a/libcpkbridge.so
          file native-libs/arm64-v8a/libcpkbridge.so
          echo "Native libraries visible inside project:"
          find . -type f -name '*.so' -not -path './obj/*' -not -path './bin/*' -print

      - name: Verify Phase 2C.1 payload
        shell: bash
        run: |
          test -s Assets/Payload/moddingapi_payload.zip
          test -s Assets/Payload/nsc_param_base.zip
          test -s Assets/Payload/nsc_message_base.zip
          echo "Payload sizes:"
          ls -lh Assets/Payload/moddingapi_payload.zip Assets/Payload/nsc_param_base.zip Assets/Payload/nsc_message_base.zip
          SO_COUNT=$(find . -type f -name 'libcpkbridge.so' -not -path './obj/*' -not -path './bin/*' | wc -l)
          if [ "$SO_COUNT" -ne 1 ]; then
            echo "Expected exactly one libcpkbridge.so in project tree, got $SO_COUNT" >&2
            find . -type f -name 'libcpkbridge.so' -print
            exit 1
          fi

      - name: Install Android SDK dependencies
        shell: bash
        run: |
          dotnet build NSC-ModManager.Android.csproj \
            -t:InstallAndroidDependencies \
            -f net10.0-android \
            -p:RuntimeIdentifier=android-arm64 \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" \
            -p:AcceptAndroidSdkLicenses=True

      - name: Compile Android project (Release)
        shell: bash
        run: |
          dotnet build NSC-ModManager.Android.csproj \
            -c Release \
            -f net10.0-android \
            -r android-arm64

      - name: Build APK
        shell: bash
        run: |
          dotnet publish NSC-ModManager.Android.csproj \
            -c Release \
            -f net10.0-android \
            -r android-arm64 \
            -p:AndroidPackageFormat=apk

      - name: Collect and verify signed APK
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact
          SIGNED=$(find bin/Release -type f -name '*-Signed.apk' -print -quit)
          if [ -z "$SIGNED" ]; then
            echo "Signed APK was not produced." >&2
            find bin/Release -type f -name '*.apk' -print
            exit 1
          fi
          cp "$SIGNED" artifact/NSC-ModManager-Android-Phase2C.1-Signed.apk
          echo "Verifying APK contents..."
          unzip -l artifact/NSC-ModManager-Android-Phase2C.1-Signed.apk | grep -F 'lib/arm64-v8a/libcpkbridge.so'
          unzip -l artifact/NSC-ModManager-Android-Phase2C.1-Signed.apk | grep -F 'assets/Payload/moddingapi_payload.zip'
          unzip -l artifact/NSC-ModManager-Android-Phase2C.1-Signed.apk | grep -F 'assets/Payload/nsc_param_base.zip'
          unzip -l artifact/NSC-ModManager-Android-Phase2C.1-Signed.apk | grep -F 'assets/Payload/nsc_message_base.zip'
          ls -lah artifact

      - uses: actions/upload-artifact@v4
        with:
          name: NSC-ModManager-Android-Phase2C.1-arm64-net10
          path: artifact/*.apk
